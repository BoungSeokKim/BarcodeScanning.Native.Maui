name: Build

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui --skip-manifest-update
      
      - name: Build generic .NET library
        run: >
          dotnet build BarcodeScanning.Native.Maui/BarcodeScanning.Native.Maui.csproj --configuration Release

      - name: Build sample app Windows
        run: >
          dotnet build BarcodeScanning.Test/BarcodeScanning.Test.csproj
          --configuration Release
          --framework net10.0-windows10.0.19041.0
          -p:TargetFrameworks=net10.0-windows10.0.19041.0
        
      - name: Build sample app Android
        run: >
          dotnet build BarcodeScanning.Test/BarcodeScanning.Test.csproj
          --configuration Release
          --framework net10.0-android
          -p:TargetFrameworks=net10.0-android

  apple:
    name: iOS and Mac Catalyst
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Select Xcode 26.0
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.0.app/Contents/Developer
          xcodebuild -version

      - name: Install MAUI workloads
        run: dotnet workload install maui-ios maui-maccatalyst --skip-manifest-update

      - name: Build sample app iOS
        run: >
          dotnet build BarcodeScanning.Test/BarcodeScanning.Test.csproj
          --configuration Release
          --framework net10.0-ios
          -p:TargetFrameworks=net10.0-ios
          -p:RuntimeIdentifier=iossimulator-arm64

      - name: Build sample app Mac Catalyst
        run: >
          dotnet build BarcodeScanning.Test/BarcodeScanning.Test.csproj
          --configuration Release
          --framework net10.0-maccatalyst
          -p:TargetFrameworks=net10.0-maccatalyst
          -p:RuntimeIdentifier=maccatalyst-arm64
